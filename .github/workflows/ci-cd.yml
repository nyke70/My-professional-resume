name: Build And Push to ECR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  buid_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ECR_REPO }}/my-repo:latest .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ECR_REPO }}/my-repo:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to Amazon ECR
        run: |
          docker push ${{ secrets.ECR_REPO }}/my-repo:latest

  deploy_to_ecs:
    needs: buid_scan
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: my-ecs-cluster
      SERVICE_NAME: my-ecs-service
      TASK_FAMILY: my-task-family
      CONTAINER_NAME: my-container

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover default VPC
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters Name=isDefault,Values=true \
            --query "Vpcs[0].VpcId" \
            --output text)

          SUBNETS=$(aws ec2 describe-subnets \
            --filters Name=vpc-id,Values=$VPC_ID \
            --query "Subnets[*].SubnetId" \
            --output text | tr '\t' ',')

          SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters Name=vpc-id,Values=$VPC_ID Name=group-name,Values=default \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          echo "SUBNETS=$SUBNETS" >> $GITHUB_ENV
          echo "SECURITY_GROUP=$SECURITY_GROUP" >> $GITHUB_ENV

      - name: Create ECS Task Execution Role
        run: |
          if ! aws iam get-role --role-name ecsTaskExecutionRole >/dev/null 2>&1; then

            cat > trust-policy.json <<EOF
            {
              "Version":"2012-10-17",
              "Statement":[
                {
                  "Effect":"Allow",
                  "Principal":{
                    "Service":"ecs-tasks.amazonaws.com"
                  },
                  "Action":"sts:AssumeRole"
                }
              ]
            } 
            EOF

            aws iam create-role \
              --role-name ecsTaskExecutionRole \
              --assume-role-policy-document file://trust-policy.json

            aws iam attach-role-policy \
              --role-name ecsTaskExecutionRole \
              --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
          fi

      - name: Wait for IAM propagation
        run: sleep 20

      - name: Create CloudWatch Log Group
        run: |
          aws logs create-log-group \
            --log-group-name /ecs/${TASK_FAMILY} || true

      - name: Create ECS Cluster
        run: |
          if ! aws ecs describe-clusters \
            --clusters $CLUSTER_NAME \
            --query "clusters[0].status" \
            --output text | grep ACTIVE; then

            aws ecs create-cluster \
              --cluster-name $CLUSTER_NAME
          fi

      - name: Create Task Definition
        run: |
          cat > task-definition.json <<EOF
          {
            "family":"${TASK_FAMILY}",
            "networkMode":"awsvpc",
            "requiresCompatibilities":["FARGATE"],
            "cpu":"256",
            "memory":"512",
            "executionRoleArn":"arn:aws:iam::871715985635:role/ecsTaskExecutionRole",
            "containerDefinitions":[
              {
                "name":"${CONTAINER_NAME}",
                "image":"${{ secrets.ECR_REPO }}/my-repo:latest",
                "essential":true,
                "portMappings":[
                  {
                    "containerPort":80,
                    "hostPort":80,
                    "protocol":"tcp"
                  }
                ],
                "logConfiguration":{
                  "logDriver":"awslogs",
                  "options":{
                    "awslogs-group":"/ecs/${TASK_FAMILY}",
                    "awslogs-region":"${AWS_REGION}",
                    "awslogs-stream-prefix":"ecs"
                  }
                }
              }
            ]
          }
          EOF

      - name: Register Task Definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-definition.json

      - name: Create or Update ECS Service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then

            aws ecs update-service \
              --cluster $CLUSTER_NAME \
              --service $SERVICE_NAME \
              --task-definition $TASK_FAMILY \
              --force-new-deployment

          else

            aws ecs create-service \
              --cluster $CLUSTER_NAME \
              --service-name $SERVICE_NAME \
              --task-definition $TASK_FAMILY \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}"

          fi