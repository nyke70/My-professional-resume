name: Build And push to ECR


on:
  push:
#    pull_request:     
#        branches: ['main']
    branches: ['main']

jobs:
    buid_scan:
        runs-on: ubuntu-latest
        steps:
            - name: checkout the code
              uses: actions/checkout@v7
            - name: Trivy Scan 
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               scan-type: 'fs'
               severity: HIGH,CRITICAL
               exit-code: 1


            - name: Build Docker Image
              run: docker build -t 871715985635.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest .
            - name: Scan Docker Image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               image-ref: 871715985635.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest
               format: table
               exit-code: 1
               ignore-unfixed: true
               severity: CRITICAL, HIGH
            - name: Push image to ECR
              run: echo "push"
                    
                      

 


